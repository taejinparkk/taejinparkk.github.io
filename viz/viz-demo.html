<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{margin:0;font-family:'IBM Plex Mono',monospace;background:#fff;color:#1a1a18;display:flex;flex-direction:column;height:100vh}
#hud{padding:14px 18px 0;font-size:11px;color:#6e6e68}
canvas{flex:1;width:100%;display:block;cursor:crosshair}
</style></head><body>
<div id="hud">bond-market liquidity index · hover to inspect</div>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),hud=document.getElementById('hud'),ctx=cv.getContext('2d');
let W,H,pts=[],t=0,mx=-1;
const N=120;for(let i=0;i<N;i++)pts.push(50+30*Math.sin(i/9)+18*Math.sin(i/3.7)+Math.random()*10);
function size(){W=cv.width=cv.clientWidth*devicePixelRatio;H=cv.height=cv.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
window.addEventListener('resize',size);
cv.addEventListener('mousemove',e=>{mx=e.offsetX});cv.addEventListener('mouseleave',()=>{mx=-1});
function draw(){
 const w=cv.clientWidth,h=cv.clientHeight,pad=40;t+=0.015;
 ctx.clearRect(0,0,w,h);
 ctx.strokeStyle='rgba(26,26,24,.1)';ctx.lineWidth=1;
 for(let g=0;g<5;g++){const y=pad+(h-2*pad)*g/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();}
 ctx.beginPath();
 for(let i=0;i<N;i++){
  const x=pad+(w-2*pad)*i/(N-1);
  const y=pad+(h-2*pad)*(1-(pts[i]+6*Math.sin(t+i/8))/120);
  i?ctx.lineTo(x,y):ctx.moveTo(x,y);
 }
 ctx.strokeStyle='#1a1a18';ctx.lineWidth=1.6;ctx.stroke();
 if(mx>=pad&&mx<=w-pad){
  const i=Math.round((mx-pad)/(w-2*pad)*(N-1));
  const x=pad+(w-2*pad)*i/(N-1);
  const v=pts[i]+6*Math.sin(t+i/8);
  const y=pad+(h-2*pad)*(1-v/120);
  ctx.strokeStyle='rgba(45,95,158,.5)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(x,pad);ctx.lineTo(x,h-pad);ctx.stroke();
  ctx.fillStyle='#2d5f9e';ctx.beginPath();ctx.arc(x,y,3.5,0,7);ctx.fill();
  hud.textContent='t = '+i+'   index = '+v.toFixed(1)+'   (demo data)';
 } else hud.textContent='bond-market liquidity index \u00b7 hover to inspect';
 requestAnimationFrame(draw);
}
size();draw();
</script></body></html>
