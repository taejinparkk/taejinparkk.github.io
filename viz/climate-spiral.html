      const ring=Math.floor(i/12),age=curRing-ring,col=ringColor(S.ringMean[ring]);
      ctx.strokeStyle=col;
      if(age<=0){ctx.globalAlpha=1;ctx.lineWidth=2.4;ctx.shadowColor=col;ctx.shadowBlur=9;}
      else if(age<=10){ctx.globalAlpha=0.9-0.05*age;ctx.lineWidth=1.6;ctx.shadowBlur=0;}
      else{ctx.globalAlpha=0.3;ctx.lineWidth=1.1;ctx.shadowBlur=0;}
      ctx.beginPath();ctx.moveTo(prev[0],prev[1]);ctx.lineTo(p[0],p[1]);ctx.stroke();
    }
    prev=p;prevI=i;
  }
  // partial segment of the month being drawn
  if(frac>0&&nSeg>0&&nSeg<S.anom.length){
    const a0=S.anom[nSeg-1],a1=S.anom[nSeg];
    if(a0!==null&&a1!==null){
      const p0=proj(angOf((nSeg-1)%12),rOf(a0),hOf(nSeg-1));
      const th=angOf((nSeg-1)%12)+(Math.PI/6)*frac;
      const p1=proj(th,rOf(a0+(a1-a0)*frac),hOf(nSeg-1+frac));
      const col=ringColor(S.ringMean[curRing]);
      ctx.strokeStyle=col;ctx.shadowColor=col;ctx.shadowBlur=9;
      ctx.globalAlpha=1;ctx.lineWidth=2.4;
      ctx.beginPath();ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p1[0],p1[1]);ctx.stroke();
    }
  }
  ctx.globalAlpha=1;ctx.shadowBlur=0;

  // year counter: center -> top-right as it tilts
  const p=tilt/TILT_MAX,e=p*p*(3-2*p);
  const yr=Math.min(S.start+Math.floor(mi/12),S.endYear);
  const px=cx+( W-cx-74)*e, py=cy+(46-cy)*e;
  ctx.fillStyle='#ececea';
  ctx.font='500 '+(30-8*e)+'px "IBM Plex Mono",monospace';ctx.textAlign='center';
  ctx.fillText(phase==='settle'?S.start+'–'+S.endYear:String(yr),px,py+10);

  // annotation after the reveal
  if(annA>0.02){
    const hTop=hOf(S.anom.length-1)*Math.sin(tilt);
    ctx.textAlign='left';
    ctx.fillStyle='rgba(255,92,64,'+annA+')';
    ctx.font='500 13px "IBM Plex Sans",sans-serif';
    ctx.fillText('2016–25: +'+S.warming.toFixed(1)+' °C',cx+rOf(3)+14,cy-hTop+22);
    ctx.fillStyle='rgba(143,143,136,'+(0.9*annA)+')';
    ctx.font='400 10.5px "IBM Plex Mono",monospace';
    ctx.fillText('vs 1871–1900',cx+rOf(3)+14,cy-hTop+38);
  }
}

// controls
const cityBox=document.getElementById('cities');
for(const st of STATIONS){
  const b=document.createElement('button');
  b.className='pill'+(st.id==='bas'?' on':'');
  b.textContent=st.name.split('/')[0];
  b.addEventListener('click',()=>{
    cityBox.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    pickStation(st.id);
  });
  cityBox.appendChild(b);
}
document.getElementById('btnSkip').addEventListener('click',()=>{
  if(phase==='draw'){mi=S.anom.length;phase='pause';tPhase=0.9;}
});
document.getElementById('btnReplay').addEventListener('click',()=>{
  if(reduced){annA=1;return restart();}
  restart();
});
window.addEventListener('resize',layout);

pickStation('bas');
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{});
requestAnimationFrame(frame);
</script>
